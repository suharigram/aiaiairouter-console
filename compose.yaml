services:
  postgres:
    image: postgres:17-alpine
    container_name: aiaiairouter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiaiairouter
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiaiairouter"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
